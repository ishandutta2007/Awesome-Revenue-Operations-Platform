<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -800; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5px; opacity: 0.8; }
        50% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      .pulse-glow { animation: pulse 6s ease-in-out infinite; }
      .chart-line { stroke-dasharray: 12, 6; animation: dash 20s linear infinite; }
      .floating-badge { animation: float 4s ease-in-out infinite; }
      .glowing-node { animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Dynamic Ambient Glow Circles -->
  <circle cx="200" cy="120" r="160" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulse-glow" />
  <circle cx="1000" cy="280" r="180" fill="#a855f7" opacity="0.18" filter="url(#glow)" class="pulse-glow" style="animation-delay: -3s;" />

  <!-- Revenue Pipeline Trend Area & Path -->
  <path d="M 150,320 Q 350,300 500,240 T 800,180 T 1050,110 L 1050,350 L 150,350 Z" fill="url(#chart-grad)" />
  <path d="M 150,320 Q 350,300 500,240 T 800,180 T 1050,110" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" class="chart-line" />
  <path d="M 150,320 Q 350,300 500,240 T 800,180 T 1050,110" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

  <!-- Pipeline Milestone Nodes -->
  <circle cx="150" cy="320" r="6" fill="#38bdf8" />
  <circle cx="375" cy="285" r="6" fill="#60a5fa" class="glowing-node" />
  <circle cx="500" cy="240" r="6" fill="#818cf8" />
  <circle cx="680" cy="205" r="6" fill="#a78bfa" class="glowing-node" style="animation-delay: 1s;" />
  <circle cx="800" cy="180" r="6" fill="#c084fc" />
  <circle cx="940" cy="140" r="6" fill="#e879f9" class="glowing-node" style="animation-delay: 2s;" />
  <circle cx="1050" cy="110" r="7" fill="#38bdf8" filter="url(#glow)" />

  <!-- Header Category Eyebrow Badge -->
  <g transform="translate(600, 68)" class="floating-badge">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ⚡ CURATED REVOPS &amp; REVENUE INTELLIGENCE
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Awesome Revenue Operations
  </text>
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="url(#accent-grad)" letter-spacing="4">
    PLATFORM ECOSYSTEM
  </text>

  <!-- Subtitle -->
  <text x="600" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="0.5">
    Revenue Intelligence • Pipeline Forecasting • Lead-to-Cash • Activity Capture • CRM Data Ops
  </text>

  <!-- Feature Tags / Pills -->
  <g transform="translate(600, 275)">
    <!-- Pill 1 -->
    <g transform="translate(-290, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">📈 AI Forecasting</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-95, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">🎯 Lead Routing</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(100, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">🔄 CRM Hygiene</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(295, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f472b6">⚡ GTM Alignment</text>
    </g>
  </g>
</svg>